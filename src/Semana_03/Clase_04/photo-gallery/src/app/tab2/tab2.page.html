<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Galería de Fotos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Galería de Fotos</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (photoService.photos().length === 0) {
  <div class="empty-state">
    <ion-icon name="camera-outline" class="empty-icon"></ion-icon>
    <h3>No existen fotos</h3>
    <p>Pulsa el botón para tomar o guardar fotos.</p>
  </div>
  } @else {
  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos(); track photo.filepath; let position = $index) {
      <ion-col size="6" size-md="4" size-lg="3">
        <div class="photo-card" (click)="showActionSheet(photo, position)">
          <ion-img [src]="photo.webviewPath" [alt]="'Foto ' + (position + 1)" class="gallery-image"></ion-img>
          <button
            type="button"
            class="delete-badge"
            aria-label="Eliminar foto"
            (click)="$event.stopPropagation(); showActionSheet(photo, position)"
          >
            <ion-icon name="trash"></ion-icon>
          </button>
        </div>
      </ion-col>
      }
    </ion-row>
  </ion-grid>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button color="primary" (click)="addPhotoToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

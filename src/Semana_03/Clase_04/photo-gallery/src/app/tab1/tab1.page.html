<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="welcome-container">
    <ion-card class="welcome-card">
      <div class="image-wrapper">
        <img src="assets/shapes.svg" alt="Foto de Inicio" class="welcome-image" />
      </div>

      <ion-card-header>
        <ion-card-subtitle>Aplicación Móvil</ion-card-subtitle>
        <ion-card-title>Galería de Fotos</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <p>
          Bienvenido a la aplicación de galería de fotos. Aquí puedes capturar nuevas fotos y verlas en tu galería.
        </p>
      </ion-card-content>

      <div class="ion-padding">
        <ion-button expand="block" shape="round" routerLink="/tabs/tab2">
          <ion-icon slot="start" name="camera-outline"></ion-icon>
          Abrir Galería
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>
      </div>
    </ion-card>
  </div>
</ion-content>
